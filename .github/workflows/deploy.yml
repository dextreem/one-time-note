# Copy to .github/workflows/deploy.yml in any project you want deployed.
#
# Build here, not on the server: push to ghcr.io, then poke Dokploy to pull.
# The image is tagged with the commit SHA, so rolling back is redeploying an
# older tag rather than reverting and rebuilding.
#
# Repository settings → Secrets and variables → Actions:
#   DOKPLOY_WEBHOOK   the deploy webhook URL from the Dokploy application
# GITHUB_TOKEN is provided automatically; no PAT needed to push to ghcr.io.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # A newer push supersedes an in-flight one; never deploy out of order.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives with the runner, so builds stay fast without
          # costing the server any disk.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploying is skipped rather than failed when the webhook is unset, so
      # the image still builds and publishes before the server exists. A red
      # build on every push would just train you to ignore CI.
      - name: Tell Dokploy to pull
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            {
              echo "### Image published, not deployed"
              echo
              echo 'No `DOKPLOY_WEBHOOK` secret is set, so nothing was told to pull it.'
              echo "Image: \`${{ steps.meta.outputs.tags }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "DOKPLOY_WEBHOOK not set — skipping deploy (image is published)"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST "$WEBHOOK"
          echo "deploy triggered for ${{ github.sha }}"
